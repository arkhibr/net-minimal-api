# Configuração do Gitleaks usada por .github/workflows/seguranca.yml.
# Mantém as regras padrão e acrescenta exceções por valor exato, cada uma restrita ao arquivo
# em que o valor aparece (condition = "AND" exige que caminho e regex casem juntos).
# Nenhum arquivo e nenhum commit é ignorado por inteiro.
title = "net-minimal-api"

[extend]
useDefault = true

# Os dois valores de appsettings.json abaixo não disparam as regras padrão da versão 8.30.1,
# por terem entropia baixa. A exceção é preventiva: ela mantém a esteira verde se uma regra
# futura passar a casar com eles, sem abrir o arquivo inteiro à varredura.

[[allowlists]]
description = "Chave JWT de demonstração de appsettings.json"
# valor de demonstração documentado no README e restrito ao ambiente local
condition = "AND"
paths = ['''^appsettings\.json$''']
regexes = ['''^MinhaChaveSuperSecretaDePeloMenos32BytesAki123!$''']

[[allowlists]]
description = "Senha de administrador de demonstração de appsettings.json"
# valor de demonstração documentado no README e restrito ao ambiente local
condition = "AND"
paths = ['''^appsettings\.json$''']
regexes = ['''^senha123$''']

# Achados do histórico, todos exemplos de documentação e não credenciais.

[[allowlists]]
description = "Marcador SEU_TOKEN em exemplos curl do README e do plano de documentação"
# valor de demonstração, é um texto a ser substituído pelo leitor e não um token
condition = "AND"
paths = ['''^README\.md$''', '''^docs/plans/2026-02-27-documentacao-reestruturacao-plan\.md$''']
regexes = ['''^SEU_TOKEN$''']

[[allowlists]]
description = "Chave de idempotência de exemplo no guia de melhores práticas"
# valor de demonstração, identificador fictício de um exemplo de requisição
condition = "AND"
paths = ['''^docs/MELHORES-PRATICAS-API\.md$''']
regexes = ['''^meu-pedido-uuid-12345$''']

[[allowlists]]
description = "Chave de idempotência de exemplo na resposta de conflito do Pix"
# valor de demonstração, identificador fictício de um exemplo de resposta JSON
condition = "AND"
paths = ['''^docs/examples/pix-json/problem-idempotency-conflict-response\.json$''']
regexes = ['''^b0f0cd4e-1847-4042-b795-1de71bf1a58d$''']
